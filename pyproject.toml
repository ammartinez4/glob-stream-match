[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "globstream"
version = "0.1.0"
description = "Glob pattern matching over streamed paths, without loading input into memory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ammartinez4" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
globstream = ["py.typed"]
